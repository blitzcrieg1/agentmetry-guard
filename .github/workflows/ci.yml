name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions: read-all

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --offline --locked --release
      - run: cargo clippy --offline --locked --release -- -D warnings
      - run: cargo build --offline --locked --release
      - name: Smoke test the built binary on loopback
        shell: bash
        run: bash scripts/smoke.sh ./target/release/agentmetry-guard
